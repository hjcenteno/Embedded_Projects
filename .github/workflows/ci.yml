name: CI

on:
  push:
    branches: [DEV]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi cmake

      - name: Set up environment (CMSIS, startup, linker)
        run: cmake -P bootstrap.cmake

      - name: Build every project
        run: |
          for d in */; do
            d=${d%/}
            if ls "$d"/src/*.c >/dev/null 2>&1; then
              echo "== Building $d =="
              make -C "$d" -f "$PWD/makefile" "$d"
            fi
          done

  static-analysis:
    name: cppcheck + clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck clang-tidy gcc-arm-none-eabi cmake

      - name: Set up environment (CMSIS, startup, linker)
        run: cmake -P bootstrap.cmake

      - name: cppcheck
        run: |
          FILES=$(find . -path '*/src/*.c')
          if [ -z "$FILES" ]; then
            echo "No .c files found -- check .gitignore / branch tracking."
            exit 1
          fi
          cppcheck \
            --enable=warning,style,performance,portability \
            --std=c11 \
            --suppress=missingIncludeSystem \
            --suppress=toomanyconfigs \
            --suppress=constVariablePointer:*/cmsis_core/* \
            --suppress=constVariablePointer:*/cmsis_device_g4/* \
            -I "$HOME/cmsis_core/CMSIS/Core/Include" \
            -I "$HOME/cmsis_device_g4/Include" \
            --error-exitcode=1 \
            $FILES

      - name: clang-tidy
        run: |
          GCC_INCLUDES=$(echo | arm-none-eabi-gcc -mcpu=cortex-m4 -mthumb -mfpu=fpv4-sp-d16 -mfloat-abi=hard -E -Wp,-v -xc - 2>&1 \
            | sed -n '/search starts here/,/End of search/p' | grep '^ ' | sed 's/^ /-I/')
          FILES=$(find . -path '*/src/*.c')
          for f in $FILES; do
            clang-tidy "$f" \
              --checks='bugprone-*,clang-analyzer-*,cert-*' \
              -- -I"$HOME/cmsis_core/CMSIS/Core/Include" \
                 -I"$HOME/cmsis_device_g4/Include" \
                 $GCC_INCLUDES \
                 -DSTM32G474xx --target=arm-none-eabi -mcpu=cortex-m4 -mthumb
          done

  clang-static-analyzer:
    name: Clang Static Analyzer (dataflow checks -- important for UART/parsing code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi cmake clang clang-tools

      - name: Set up environment (CMSIS, startup, linker)
        run: cmake -P bootstrap.cmake

      - name: Run scan-build across every project
        run: |
          SCAN_BUILD=$(command -v scan-build || find /usr/lib/llvm-*/bin /usr/bin -maxdepth 1 -name 'scan-build*' 2>/dev/null | sort -V | tail -1)
          if [ -z "$SCAN_BUILD" ]; then
            echo "Could not locate a scan-build binary after installing clang-tools."
            exit 1
          fi
          echo "Using $SCAN_BUILD"
          export CCC_CC=arm-none-eabi-gcc
          for d in */; do
            d=${d%/}
            if ls "$d"/src/*.c >/dev/null 2>&1; then
              echo "== Analyzing $d =="
              "$SCAN_BUILD" --status-bugs make -C "$d" -f "$PWD/makefile" "$d"
            fi
          done